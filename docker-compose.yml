
services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: godseye-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - godseye-network

  postgres:
    image: postgres:15-alpine
    container_name: godseye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: godseye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - godseye-network

  api_gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: godseye-gateway
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      POSTGRES_URL: postgres://postgres:postgres123@postgres:5432/godseye
      GATEWAY_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - godseye-network

  worker_node:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      BATCH_SIZE: 4
      POSTGRES_URL: postgres://postgres:postgres123@postgres:5432/godseye
      WORKER_ID: ${WORKER_ID:-worker-1}
      SUPABASE_URL: https://bnrpcmwkqqdmweoxkmth.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJucnBjbXdrcXFkbXdlb3hrbXRoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MDgwMDU2NiwiZXhwIjoyMDc2Mzc2NTY2fQ.5bWehH-YMcXq-OYDamtMeplEqZuUy2xTHDieB9D8eVc
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      HEADLESS: ${HEADLESS:-true}
      STORAGE_MODE_API: ${STORAGE_MODE_API:-false}
      CALLBACK_API_URL: ${CALLBACK_API_URL}
      CALLBACK_TIMEOUT: ${CALLBACK_TIMEOUT:-30}
      DEBUG: ${DEBUG:-false}
      SCREENSHOT: ${SCREENSHOT:-true}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - godseye-network
    deploy:
      replicas: 5

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local

networks:
  godseye-network:
    driver: bridge
